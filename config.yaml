# Shared settings for all scripts. Change values here, not inside the code.

data:
  raw_csv: data/raw/spy_2020_2022.csv
  processed_dir: data/processed
  drop_dates:            # 2022 NYSE holidays present in the raw file
    - 2022-01-17
    - 2022-02-21
    - 2022-04-15
    - 2022-05-30
    - 2022-06-20
    - 2022-07-04
    - 2022-09-05
    - 2022-11-24
    - 2022-12-26

filters:
  min_volume: 1
  max_rel_spread: 0.5
  iv_min: 0.01
  iv_max: 2.0
  max_abs_log_moneyness: 1.0
  min_dte: 7
  otm_only: true

masking:
  random_fraction: 0.2
  wing_fraction: 0.2
  schemes: [random, wing, expiry]

split:
  first_test_month: 2020-07
  retrain: monthly

regimes:
  covid_crash: [2020-02-20, 2020-04-30]
  recovery:    [2020-05-01, 2020-12-31]
  calm:        [2021-01-01, 2021-12-31]
  bear:        [2022-01-01, 2022-12-31]

seed: 42
